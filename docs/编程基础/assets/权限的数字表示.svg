<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" fill="#212529">权限的数字表示：三组三位二进制</text>

  <!-- 第一组：属主 -->
  <text x="160" y="76" text-anchor="middle" font-size="14" fill="#1c7ed6">属主（你自己）</text>
  <rect x="106" y="90" width="36" height="36" rx="5" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
  <rect x="142" y="90" width="36" height="36" rx="5" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
  <rect x="178" y="90" width="36" height="36" rx="5" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="124" y="115" text-anchor="middle" font-size="17" fill="#1c7ed6">r</text>
  <text x="160" y="115" text-anchor="middle" font-size="17" fill="#1c7ed6">w</text>
  <text x="196" y="115" text-anchor="middle" font-size="17" fill="#1c7ed6">x</text>
  <text x="124" y="156" text-anchor="middle" font-size="15" fill="#495057">1</text>
  <text x="160" y="156" text-anchor="middle" font-size="15" fill="#495057">1</text>
  <text x="196" y="156" text-anchor="middle" font-size="15" fill="#495057">1</text>
  <text x="160" y="192" text-anchor="middle" font-size="20" fill="#1c7ed6">7</text>

  <!-- 第二组：属组 -->
  <text x="320" y="76" text-anchor="middle" font-size="14" fill="#2b8a3e">同组的人</text>
  <rect x="266" y="90" width="36" height="36" rx="5" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
  <rect x="302" y="90" width="36" height="36" rx="5" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
  <rect x="338" y="90" width="36" height="36" rx="5" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="284" y="115" text-anchor="middle" font-size="17" fill="#2b8a3e">r</text>
  <text x="320" y="115" text-anchor="middle" font-size="17" fill="#adb5bd">-</text>
  <text x="356" y="115" text-anchor="middle" font-size="17" fill="#2b8a3e">x</text>
  <text x="284" y="156" text-anchor="middle" font-size="15" fill="#495057">1</text>
  <text x="320" y="156" text-anchor="middle" font-size="15" fill="#495057">0</text>
  <text x="356" y="156" text-anchor="middle" font-size="15" fill="#495057">1</text>
  <text x="320" y="192" text-anchor="middle" font-size="20" fill="#2b8a3e">5</text>

  <!-- 第三组：其他人 -->
  <text x="480" y="76" text-anchor="middle" font-size="14" fill="#d9480f">其他所有人</text>
  <rect x="426" y="90" width="36" height="36" rx="5" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/>
  <rect x="462" y="90" width="36" height="36" rx="5" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/>
  <rect x="498" y="90" width="36" height="36" rx="5" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/>
  <text x="444" y="115" text-anchor="middle" font-size="17" fill="#d9480f">r</text>
  <text x="480" y="115" text-anchor="middle" font-size="17" fill="#adb5bd">-</text>
  <text x="516" y="115" text-anchor="middle" font-size="17" fill="#d9480f">x</text>
  <text x="444" y="156" text-anchor="middle" font-size="15" fill="#495057">1</text>
  <text x="480" y="156" text-anchor="middle" font-size="15" fill="#495057">0</text>
  <text x="516" y="156" text-anchor="middle" font-size="15" fill="#495057">1</text>
  <text x="480" y="192" text-anchor="middle" font-size="20" fill="#d9480f">5</text>

  <text x="320" y="238" text-anchor="middle" font-size="18" fill="#212529" font-family="Menlo, Consolas, monospace">chmod 755 run.sh</text>

  <text x="320" y="282" text-anchor="middle" font-size="13" fill="#495057">读 r 记 4，写 w 记 2，执行 x 记 1，把有的加起来</text>
  <text x="320" y="310" text-anchor="middle" font-size="13" fill="#495057">755 就是：我能读写执行，别人只能读和执行</text>
</svg>
