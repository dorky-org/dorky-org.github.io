<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="400" height="360" fill="#ffffff"/>
  <text x="200" y="28" text-anchor="middle" font-size="16" fill="#212529">三角形面积就是半个平行四边形</text>
  <line x1="296.8" y1="237.6" x2="364.0" y2="52.8" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="179.2" y1="103.2" x2="364.0" y2="52.8" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="112.0,288.0 296.8,237.6 364.0,52.8 179.2,103.2" fill="#fff3bf" stroke="none" stroke-width="0"/>
  <polygon points="112.0,288.0 296.8,237.6 179.2,103.2" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2.4"/><line x1="112.0" y1="288.0" x2="296.8" y2="237.6" stroke="#e03131" stroke-width="2.6"/>
  <polygon points="296.8,237.6 288.9,243.8 286.9,236.3" fill="#e03131"/><line x1="112.0" y1="288.0" x2="179.2" y2="103.2" stroke="#2f9e44" stroke-width="2.6"/>
  <polygon points="179.2,103.2 179.7,113.2 172.4,110.5" fill="#2f9e44"/>
  <circle cx="112.0" cy="288.0" r="4" fill="#212529"/><circle cx="296.8" cy="237.6" r="4" fill="#1c7ed6"/><circle cx="179.2" cy="103.2" r="4" fill="#1c7ed6"/>
  <text x="98" y="304" text-anchor="middle" font-size="15" fill="#212529">A</text><text x="311" y="242" text-anchor="middle" font-size="15" fill="#212529">B</text><text x="175" y="89" text-anchor="middle" font-size="15" fill="#212529">C</text>
  <text x="210" y="279" text-anchor="middle" font-size="14" fill="#e03131">u = AB</text>
  <text x="116" y="192" text-anchor="middle" font-size="14" fill="#2f9e44">v = AC</text>
  <text x="300" y="90" text-anchor="middle" font-size="14" fill="#868e96">平行四边形面积</text><text x="300" y="112" text-anchor="middle" font-size="14" fill="#868e96">= |u₁v₂ − u₂v₁|</text>
  <text x="300" y="300" text-anchor="middle" font-size="15" fill="#212529">△ABC 面积</text><text x="300" y="322" text-anchor="middle" font-size="13" fill="#868e96">= 平行四边形面积的一半</text>
</svg>
