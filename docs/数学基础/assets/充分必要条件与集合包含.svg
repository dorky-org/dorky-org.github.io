<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" width="1040" height="310" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1040" height="310" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="19" fill="#212529">充分必要条件与集合包含关系的对应</text>
  <circle cx="140.0" cy="170.0" r="62" fill="none" stroke="#f08c00" stroke-width="2.6"/><circle cx="122.0" cy="178.0" r="30" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2.6"/><text x="122" y="178" text-anchor="middle" font-size="16" fill="#1c7ed6">P</text><text x="182" y="97" text-anchor="middle" font-size="16" fill="#f08c00">Q</text><text x="140" y="258" text-anchor="middle" font-size="17" fill="#212529">p 是 q 的充分不必要条件</text><text x="140" y="282" text-anchor="middle" font-size="13" fill="#868e96">P ⊊ Q（p⇒q，q⇏p）</text><circle cx="400.0" cy="170.0" r="62" fill="none" stroke="#1c7ed6" stroke-width="2.6"/><circle cx="382.0" cy="178.0" r="30" fill="#ffe8cc" stroke="#f08c00" stroke-width="2.6"/><text x="382" y="178" text-anchor="middle" font-size="16" fill="#f08c00">Q</text><text x="442" y="97" text-anchor="middle" font-size="16" fill="#1c7ed6">P</text><text x="400" y="258" text-anchor="middle" font-size="17" fill="#212529">p 是 q 的必要不充分条件</text><text x="400" y="282" text-anchor="middle" font-size="13" fill="#868e96">Q ⊊ P（q⇒p，p⇏q）</text><circle cx="650.0" cy="170.0" r="50" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2.6"/><text x="650" y="170" text-anchor="middle" font-size="17" fill="#1c7ed6">P = Q</text><text x="650" y="258" text-anchor="middle" font-size="17" fill="#212529">p 是 q 的充要条件</text><text x="650" y="282" text-anchor="middle" font-size="13" fill="#868e96">P = Q（p⇔q）</text><circle cx="850.0" cy="170.0" r="42" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2.6"/><circle cx="930.0" cy="170.0" r="42" fill="#ffe8cc" stroke="#f08c00" stroke-width="2.6"/><text x="850" y="170" text-anchor="middle" font-size="16" fill="#1c7ed6">P</text><text x="930" y="170" text-anchor="middle" font-size="16" fill="#f08c00">Q</text><text x="890" y="258" text-anchor="middle" font-size="17" fill="#212529">p 是 q 的既不充分也不必要条件</text><text x="890" y="282" text-anchor="middle" font-size="13" fill="#868e96">P、Q 互不包含</text>
</svg>
