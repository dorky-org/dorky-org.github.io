<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto">
<path d="M0,0 L5.5,2.5 L0,5 Z" fill="#333"/>
</marker>
</defs>
<rect x="0" y="0" width="700" height="340" fill="#ffffff"/>

<!-- panel 1: 是函数 -->
<ellipse cx="90" cy="160" rx="60" ry="110" fill="none" stroke="#333" stroke-width="1.5"/>
<ellipse cx="240" cy="160" rx="50" ry="95" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="90" y="35" font-size="15" fill="#333" text-anchor="middle">A</text>
<text x="240" y="50" font-size="15" fill="#333" text-anchor="middle">B</text>

<circle cx="90" cy="95" r="3.5" fill="#2563eb"/>
<circle cx="90" cy="160" r="3.5" fill="#2563eb"/>
<circle cx="90" cy="225" r="3.5" fill="#2563eb"/>
<circle cx="240" cy="120" r="3.5" fill="#2563eb"/>
<circle cx="240" cy="210" r="3.5" fill="#2563eb"/>

<text x="72" y="99" font-size="12" fill="#2563eb" text-anchor="end">x&#8321;</text>
<text x="72" y="164" font-size="12" fill="#2563eb" text-anchor="end">x&#8322;</text>
<text x="72" y="229" font-size="12" fill="#2563eb" text-anchor="end">x&#8323;</text>
<text x="258" y="116" font-size="12" fill="#2563eb" text-anchor="start">y&#8321;</text>
<text x="258" y="206" font-size="12" fill="#2563eb" text-anchor="start">y&#8322;</text>

<line x1="93" y1="97" x2="234" y2="119" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="93" y1="159" x2="234" y2="122" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="93" y1="223" x2="234" y2="211" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>

<text x="165" y="300" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">是函数：每个 x 只对应一个 y</text>

<!-- panel 2: 不是函数 -->
<ellipse cx="450" cy="160" rx="60" ry="110" fill="none" stroke="#333" stroke-width="1.5"/>
<ellipse cx="600" cy="160" rx="50" ry="95" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="450" y="35" font-size="15" fill="#333" text-anchor="middle">A&#8242;</text>
<text x="600" y="50" font-size="15" fill="#333" text-anchor="middle">B&#8242;</text>

<circle cx="450" cy="160" r="3.5" fill="#dc2626"/>
<circle cx="600" cy="120" r="3.5" fill="#dc2626"/>
<circle cx="600" cy="210" r="3.5" fill="#dc2626"/>

<text x="432" y="164" font-size="12" fill="#dc2626" text-anchor="end">x&#8321;</text>
<text x="618" y="116" font-size="12" fill="#dc2626" text-anchor="start">y&#8321;</text>
<text x="618" y="206" font-size="12" fill="#dc2626" text-anchor="start">y&#8322;</text>

<line x1="453" y1="157" x2="594" y2="122" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="453" y1="163" x2="594" y2="208" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow)"/>

<text x="525" y="300" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">不是函数：一个 x 对应两个 y</text>
</svg>
