  <text x="190" y="352" text-anchor="middle" font-size="15" fill="#212529">重心 G：三条中线的交点</text><text x="190" y="376" text-anchor="middle" font-size="13" fill="#868e96">AG : GM = 2 : 1，且 G = (A+B+C)/3</text>
  <polygon points="470.0,120.0 410.0,300.0 650.0,300.0" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2.2"/>
