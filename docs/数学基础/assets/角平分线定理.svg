  <line x1="462.0" y1="244.0" x2="486.3" y2="370.0" stroke="#e03131" stroke-width="2.4"/>
  
  <line x1="501.6" y1="166.8" x2="490.6" y2="162.0" stroke="#2f9e44" stroke-width="1.8"/>
