<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
  <text x="350" y="32" text-anchor="middle" font-size="16" fill="#212529">针孔相机成像：一对相似三角形</text>

  <polygon points="140,90 140,200 460,200" fill="#d0ebff" stroke="none"/>
  <polygon points="560,234.4 560,200 460,200" fill="#ffe8cc" stroke="none"/>

  <line x1="60" y1="200" x2="660" y2="200" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="7 5"/>
  <line x1="560" y1="140" x2="560" y2="262" stroke="#495057" stroke-width="2"/>

  <line x1="140" y1="90" x2="140" y2="200" stroke="#1c7ed6" stroke-width="3"/>
  <polygon points="140,90 135,101 145,101" fill="#1c7ed6"/>
  <line x1="560" y1="200" x2="560" y2="234.4" stroke="#e8590c" stroke-width="3"/>
  <polygon points="560,234.4 555,223.4 565,223.4" fill="#e8590c"/>

  <line x1="140" y1="90" x2="560" y2="234.4" stroke="#f08c00" stroke-width="1.6"/>
  <circle cx="460" cy="200" r="4.5" fill="#212529"/>

  <text x="128" y="150" text-anchor="end" font-size="15" fill="#1c7ed6">X</text>
  <text x="574" y="222" text-anchor="start" font-size="15" fill="#e8590c">x</text>
  <text x="445" y="232" text-anchor="end" font-size="13" fill="#212529">光心 O</text>
  <text x="560" y="128" text-anchor="middle" font-size="13" fill="#495057">成像平面</text>

  <line x1="140" y1="278" x2="460" y2="278" stroke="#868e96" stroke-width="1.3"/>
  <line x1="140" y1="272" x2="140" y2="284" stroke="#868e96" stroke-width="1.3"/>
  <line x1="460" y1="272" x2="460" y2="284" stroke="#868e96" stroke-width="1.3"/>
  <text x="300" y="270" text-anchor="middle" font-size="14" fill="#868e96">Z</text>
  <line x1="460" y1="278" x2="560" y2="278" stroke="#868e96" stroke-width="1.3"/>
  <line x1="560" y1="272" x2="560" y2="284" stroke="#868e96" stroke-width="1.3"/>
  <text x="510" y="270" text-anchor="middle" font-size="14" fill="#868e96">f</text>

  <text x="350" y="318" text-anchor="middle" font-size="15" fill="#212529">两个三角形相似，所以 x / f = X / Z</text>
</svg>
