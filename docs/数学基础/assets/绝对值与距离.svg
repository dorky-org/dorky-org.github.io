<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="660" height="340" fill="#ffffff"/>
  <text x="330" y="32" text-anchor="middle" font-size="16" fill="#212529">|x−1| &lt; 2 的解集：到 1 的距离小于 2</text>

  <!-- 不等式一：x &lt; 3，横线向左延伸，在 x=3 处折钩落到数轴 -->
  <text x="78" y="98" text-anchor="start" font-size="14" fill="#e03131">x &lt; 3</text>
  <polyline points="70,110 450,110 450,210" fill="none" stroke="#e03131" stroke-width="2.4"/>

  <!-- 不等式二：x &gt; −1，横线向右延伸，在 x=−1 处折钩落到数轴 -->
  <text x="594" y="140" text-anchor="end" font-size="14" fill="#1c7ed6">x &gt; −1</text>
  <polyline points="600,152 210,152 210,210" fill="none" stroke="#1c7ed6" stroke-width="2.4"/>

  <!-- 数轴 -->
  <line x1="60" y1="210" x2="612" y2="210" stroke="#212529" stroke-width="2"/>
  <polygon points="612,210 601,205 601,215" fill="#212529"/>

  <!-- 交集画在数轴上：两条横线重叠的那一段 -->
  <line x1="210" y1="210" x2="450" y2="210" stroke="#2f9e44" stroke-width="5.5"/>

  <!-- 刻度短线（端点处不画，让位给圆圈） -->
  <line x1="150" y1="204" x2="150" y2="216" stroke="#212529" stroke-width="1.8"/>
  <line x1="270" y1="204" x2="270" y2="216" stroke="#212529" stroke-width="1.8"/>
  <line x1="330" y1="204" x2="330" y2="216" stroke="#212529" stroke-width="1.8"/>
  <line x1="390" y1="204" x2="390" y2="216" stroke="#212529" stroke-width="1.8"/>

  <!-- 端点：空心圆表示取不到，颜色跟着各自的不等式 -->
  <circle cx="210" cy="210" r="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="3"/>
  <circle cx="450" cy="210" r="8" fill="#ffffff" stroke="#e03131" stroke-width="3"/>

  <!-- 刻度数字：统一放在数轴下方 36 像素处 -->
  <text x="150" y="246" text-anchor="middle" font-size="15" fill="#212529">−2</text>
  <text x="210" y="246" text-anchor="middle" font-size="15" fill="#1c7ed6">−1</text>
  <text x="270" y="246" text-anchor="middle" font-size="15" fill="#212529">0</text>
  <text x="330" y="246" text-anchor="middle" font-size="15" fill="#212529">1</text>
  <text x="390" y="246" text-anchor="middle" font-size="15" fill="#212529">2</text>
  <text x="450" y="246" text-anchor="middle" font-size="15" fill="#e03131">3</text>

  <text x="330" y="284" text-anchor="middle" font-size="15" fill="#2f9e44">解集：−1 &lt; x &lt; 3</text>
  <text x="330" y="316" text-anchor="middle" font-size="13" fill="#495057">两条横线重叠的那一段，就是数轴上的绿色解集</text>
</svg>
